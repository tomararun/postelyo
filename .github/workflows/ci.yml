name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postelyo
          POSTGRES_PASSWORD: postelyo
          POSTGRES_DB: postelyo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postelyo -d postelyo"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://postelyo:postelyo@localhost:5432/postelyo
      APP_BASE_URL: http://localhost:3000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run db:migrate
      - run: npm run test:integration
      - run: npm run build
      - run: npm audit --audit-level=high
