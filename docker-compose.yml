services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postelyo
      POSTGRES_PASSWORD: postelyo
      POSTGRES_DB: postelyo
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postelyo -d postelyo']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '8025:8025' # web UI
      - '1025:1025' # SMTP

volumes:
  pgdata:
