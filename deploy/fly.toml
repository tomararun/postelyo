# Fly.io configuration (architecture §18.1). One image, two process groups.
# Deploy with: flyctl deploy --config deploy/fly.toml --app <app-name>
# Secrets (flyctl secrets set ...): DATABASE_URL AUTH_SECRET ENCRYPTION_KEYS SMTP_URL
#   LINKEDIN_CLIENT_ID LINKEDIN_CLIENT_SECRET X_CLIENT_ID X_CLIENT_SECRET META_APP_ID META_APP_SECRET
#   S3_BUCKET S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY S3_ENDPOINT S3_PUBLIC_BASE_URL (STORAGE_DRIVER=s3)
#   ALERT_EMAIL METRICS_TOKEN SENTRY_DSN NOTION_WEBHOOK_SECRET NOTION_CLIENT_ID NOTION_CLIENT_SECRET
#   STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_PRICE_SOLO STRIPE_PRICE_TEAM STRIPE_PRICE_AGENCY
#   ANTHROPIC_API_KEY (AI_MODEL optional, defaults to claude-opus-5)
#   MEDIA_EGRESS_PROXY_URL (optional, Phase 7 fixed-IP media downloads)
# REGION below labels the installation; deploy/fly.eu.toml is the EU twin with its own secrets.
# The dashboard (apps/web) is a separate Fly app built from apps/web/Dockerfile with API_INTERNAL_URL
# pointing at this app's internal address and APP_BASE_URL set to the dashboard's public origin.

app = "postelyo"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = "40s"

[build]
  dockerfile = "../apps/api/Dockerfile"

[deploy]
  # Expand/contract migrations run once before the new release starts (§18.2).
  release_command = "node apps/api/dist/infra/db/migrate.js"
  strategy = "rolling"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  LOG_LEVEL = "info"
  MAIL_TRANSPORT = "smtp"
  PROVIDER_MODE = "live"
  STORAGE_DRIVER = "s3"
  REGION = "us"

[processes]
  api = "node apps/api/dist/main-api.js"
  worker = "node apps/api/dist/main-worker.js"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["api"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 400

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    path = "/health/ready"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["api"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["worker"]
